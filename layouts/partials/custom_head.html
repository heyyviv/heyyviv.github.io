<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet">

<style>
    :root {
        --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-serif: 'Playfair Display', Georgia, serif;
        --bg-light: #FAFAFA;
        --text-dark: #2D3748;
        --accent-primary: #4A5568;
        --accent-secondary: #718096;
        --night-bg: #1A202C;
        --night-text: #E2E8F0;
        --night-accent: #A0AEC0;

        --body-bg-color: var(--bg-light);
        --bold-text-color: #1A202C;
        --body-text-color: var(--text-dark);
        --link-color: #3182CE;
        --link-visited-color: #6B46C1;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        transition: background-color 0.4s ease, color 0.4s ease;
        font-family: var(--font-primary);
        line-height: 1.8;
        background-color: var(--body-bg-color);
        color: var(--body-text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--font-serif);
        color: var(--bold-text-color);
        margin-top: 2em;
        margin-bottom: 0.75em;
        line-height: 1.3;
        letter-spacing: -0.02em;
    }

    /* Force Light Mode */
    body.light-mode {
        --body-bg-color: var(--bg-light);
        --bold-text-color: #1A202C;
        --body-text-color: var(--text-dark);
        --link-color: #3182CE;
        --code-bg-color: #F7FAFC;
        --code-text-color: #2D3748;
        --blockquote-border-color: #E2E8F0;
        --blockquote-text-color: #4A5568;
    }

    /* Force Dark Mode */
    body.dark-mode {
        --body-bg-color: var(--night-bg);
        --bold-text-color: #F7FAFC;
        --body-text-color: var(--night-text);
        --link-color: #63B3ED;
        --code-bg-color: #2D3748;
        --code-text-color: #E2E8F0;
        --blockquote-border-color: #4A5568;
        --blockquote-text-color: #A0AEC0;
    }



    #theme-toggle {
        border: 1px solid var(--accent-secondary);
        background: transparent;
        color: var(--body-text-color);
        cursor: pointer;
        padding: 5px 12px;
        border-radius: 20px;
        margin-left: 10px;
        font-family: var(--font-primary);
        font-weight: 600;
        transition: all 0.3s ease;
    }

    #theme-toggle:hover {
        transform: scale(1.05);
        border-color: var(--accent-sky);
    }

    #back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: var(--accent-primary);
        border: none;
        color: white;
        padding: 12px;
        border-radius: 50%;
        cursor: pointer;
        display: none;
        z-index: 100;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
    }

    #back-to-top:hover {
        transform: translateY(-5px);
        background-color: var(--accent-sky);
    }

    /* Nice hover for links */
    a {
        text-decoration: none;
        color: var(--link-color);
        transition: color 0.2s ease, border-bottom-color 0.2s ease;
        border-bottom: 1px solid transparent;
    }

    a:hover {
        border-bottom-color: var(--link-color);
    }
    
    .title h1 {
        margin-top: 0;
        color: var(--bold-text-color);
        text-decoration: none;
    }
    
    .title:hover {
        border-bottom: none;
    }
    
    nav a {
        color: var(--body-text-color);
        margin-right: 15px;
        font-weight: 500;
        font-size: 0.95rem;
    }
    
    nav a:hover {
        color: var(--link-color);
        border-bottom-color: transparent;
    }
    
    /* Blog Post List Styles */
    .blog-posts {
        list-style: none;
        padding-left: 0;
    }
    
    .blog-posts li {
        margin-bottom: 0.5rem;
        padding: 0.25rem 0;
        display: flex;
        align-items: baseline;
        gap: 1rem;
    }
    
    .blog-posts time {
        display: inline-block;
        width: 110px; /* Give enough width for "28 Feb, 2026" */
        color: var(--accent-secondary);
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
        flex-shrink: 0; /* Prevent the date from wrapping/shrinking */
    }
    
    /* Post Title Styles */
    .blog-posts a {
        font-weight: 500;
        color: var(--body-text-color);
        display: inline-block;
    }
    
    .blog-posts a:hover {
        color: var(--link-color);
    }

    blockquote {
        border-left: 4px solid var(--blockquote-border-color);
        padding: 0.5rem 1.5rem;
        background: var(--code-bg-color);
        border-radius: 0 4px 4px 0;
        font-style: italic;
        margin-left: 0;
        margin-right: 0;
    }
</style>

<script>
    // Back to Top Logic
    document.addEventListener('DOMContentLoaded', () => {
        const backToTopBtn = document.getElementById('back-to-top');
        if (backToTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    });
</script>
