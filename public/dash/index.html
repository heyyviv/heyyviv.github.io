<script>
    
    (function () {
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const iconSun = "☀️";
        const iconMoon = "🌙";

        
        function setIcon(isDark) {
            toggleBtn.innerHTML = isDark ? iconSun : iconMoon;
            toggleBtn.setAttribute('aria-label', isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode');
        }

        
        let currentTheme = localStorage.getItem('theme');

        
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (!currentTheme) {
            currentTheme = systemPrefersDark ? 'dark' : 'light';
        }

        
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            setIcon(true);
        } else {
            body.classList.add('light-mode');
            setIcon(false);
        }

        
        toggleBtn.addEventListener('click', function () {
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
                setIcon(false);
            } else {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
                setIcon(true);
            }
        });
    })();
</script>

<div class="form-container">
    <h2>Add New Bookmark</h2>
    <form id="bookmarkForm">
        <div class="form-group">
            <label class="form-label" for="url">URL</label>
            <input class="form-input" type="url" id="url" name="url" required placeholder="https://...">
        </div>

        <div class="form-group">
            <label class="form-label" for="title">Title / Description</label>
            <input class="form-input" type="text" id="title" name="title" required
                placeholder="What is this link about?">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Secret Password</label>
            <input class="form-input" type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="form-button" id="submitBtn">Add Bookmark</button>
    </form>
    <div id="formMessage" class="form-message"></div>
</div>

<script>
    document.getElementById('bookmarkForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('formMessage');
        const url = document.getElementById('url').value;
        const title = document.getElementById('title').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = 'Saving...';
        msg.className = 'form-message'; 

        try {
            
            const workerUrl = 'https://bookmark-api.random4hello.workers.dev';

            const response = await fetch(workerUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url, title, password })
            });

            if (response.ok) {
                msg.innerText = 'Bookmark saved! The site is rebuilding, check back in a minute.';
                msg.className = 'form-message success';
                document.getElementById('bookmarkForm').reset();
            } else {
                const errData = await response.text();
                throw new Error(errData || 'Failed to save bookmark');
            }
        } catch (error) {
            msg.innerText = 'Error: ' + error.message;
            msg.className = 'form-message error';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Add Bookmark';
        }
    });
</script>

<script>
    let hasUpvoted = false;
    let upvoteBtn;
    let upvoteCount;

    
    document.addEventListener('DOMContentLoaded', function () {
        const slug = '';
        upvoteBtn = document.getElementById('upvote-btn');
        upvoteCount = document.getElementById('upvote-count');
        getCount(slug);

        
        upvoteBtn.addEventListener('click', handleUpvote);
    });

    
    async function handleUpvote() {
        if (hasUpvoted) {
            console.log('You have already upvoted this post!');
            return;
        }
        const slug = '';

        
        upvoteBtn.disabled = true;
        
        upvoteBtn.classList.add('upvoted');
        
        upvoteCount.innerText = parseInt(upvoteCount.innerText) + 1;

        try {
            const response = await fetch('https:\/\/upvote-api.random4hello.workers.dev\/upvote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ postId: slug, diff: 1 }),
            });

            if (response.ok) {
                console.log('Upvote successful!');
                hasUpvoted = true;
                await getCount(slug, 3);
            } else {
                console.log('Upvote failed!');
            }
        } catch (error) {
            console.error('Error: ', error);
        } finally {
            upvoteBtn.disabled = false;
        }
    }

    
    async function getCount(slug, retryCount = 0) {
        try {
            const response = await fetch('https:\/\/upvote-api.random4hello.workers.dev\/count?post=' + slug, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            });

            const data = await response.json();

            if (data.code === 0) {
                const count = data.data.count;
                upvoteCount.innerText = count;
                hasUpvoted = data.data.hasUpvoted;
                if (hasUpvoted) {
                    upvoteBtn.classList.add('upvoted');
                } else {
                    upvoteBtn.classList.remove('upvoted');
                }
            } else {
                console.error('Failed to get upvote count: ', data.msg);
            }
        } catch (error) {
            console.error('Error: ', error);
            if (retryCount > 0) {
                setTimeout(() => {
                    getCount(slug, retryCount - 1);
                }, 1000);
            }
        }
    }
</script>
